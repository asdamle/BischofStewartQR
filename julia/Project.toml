name = "BSPivotQR"
uuid = "f6184df7-5bd4-4f39-9a4d-c48fcf2fd03f"
authors = ["Anil Damle"]
version = "1.0.0"

# The package itself depends only on LinearAlgebra; it is cross-platform and
# installs with a minimal footprint. Benchmark/dev dependencies (BenchmarkTools,
# AppleAccelerate, DelimitedFiles, Dates, ...) live in the separate
# julia/benchmark/ environment.
[deps]
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"

[compat]
DelimitedFiles = "1"
LinearAlgebra = "1.10"
julia = "1.10"

[extras]
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "Random", "DelimitedFiles"]
