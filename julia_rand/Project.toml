name = "BSRandPivotQR"
uuid = "210a0e2f-0024-4523-b136-9b44dfbd93fb"
authors = ["Anil Damle"]
version = "0.1.0"

# The package itself depends only on stdlib (LinearAlgebra, Random); it is
# deliberately decoupled from BSPivotQR (own copies of kernel helpers, see the
# repo CLAUDE.md). BSPivotQR appears only as a test-target dependency (the
# conditioning-ballpark comparison test) via the [sources] path entry, and in
# the separate julia_rand/benchmark/ environment.
[deps]
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[sources]
BSPivotQR = {path = "../julia"}

[compat]
LinearAlgebra = "1.11"
Random = "1.11"
julia = "1.11"

[extras]
BSPivotQR = "f6184df7-5bd4-4f39-9a4d-c48fcf2fd03f"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "BSPivotQR"]
